# docker-compose.yml
services:

  backend:
    build: ./backend          # Build the backend Dockerfile
    container_name: backend   # Optional: easier to identify container
    ports:
      - "8000:8000"           # Map container port 8000 to host port 8000
    volumes:
      - ./backend:/app        # Sync local backend code into container
    environment:
      - PYTHONUNBUFFERED=1    # Ensures logs appear immediately
    restart: unless-stopped   # Restart container automatically on failure

  frontend:
    build: ./frontend         # Build the frontend Dockerfile
    container_name: frontend
    ports:
      - "5173:5173"           # Map Vite dev server port
    volumes:
      - ./frontend:/app       # Sync local frontend code into container
    depends_on:
      - backend               # Start backend first
    environment:
      - CHOKIDAR_USEPOLLING=true # For live reload in Docker on Linux
    restart: unless-stopped