name: CI

# Trigger workflow on push to main or develop branches
on:
  push:
    branches: [main, develop]

jobs:
  build:

    # Use latest Ubuntu runner
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository code
      - name: Checkout repo
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx (for better builds and caching)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Log in to Docker (optional if you plan to push to Docker Hub)
      # - name: Log in to Docker Hub
      #   uses: docker/login-action@v2
      #   with:
      #     username: ${{ secrets.DOCKER_USERNAME }}
      #     password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 4: Build Docker images for frontend and backend
      - name: Build Docker images
        run: docker compose build --pull

      # Step 5: Optionally, list built images (for debugging)
      - name: List Docker images
        run: docker images